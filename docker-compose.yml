services:
  # ============================================================================
  # User Service Database (MySQL 8)
  # Host port mapped to 3309 (avoiding port 3306 conflict with local MySQL)
  # ============================================================================
  user_db:
    image: mysql:8.0
    container_name: user_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: user_db
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "${USER_DB_PORT:-3309}:3306"
    volumes:
      - user_db_data:/var/lib/mysql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Product Service Database (MySQL 8)
  # ============================================================================
  product_db:
    image: mysql:8.0
    container_name: product_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: product_db
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "${PRODUCT_DB_PORT:-3307}:3306"
    volumes:
      - product_db_data:/var/lib/mysql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Order Service Database (MySQL 8)
  # ============================================================================
  order_db:
    image: mysql:8.0
    container_name: order_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: order_db
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    ports:
      - "${ORDER_DB_PORT:-3308}:3306"
    volumes:
      - order_db_data:/var/lib/mysql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Redis Container (API Gateway Rate Limiting & Session Store)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redispassword} ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  user_db_data:
    driver: local
  product_db_data:
    driver: local
  order_db_data:
    driver: local
  redis_data:
    driver: local

# ==============================================================================
# Dedicated Bridge Network for Inter-Service Communication
# ==============================================================================
networks:
  microservices-net:
    driver: bridge
