server:
  port: 8761

spring:
  application:
    name: service-registry

eureka:
  instance:
    hostname: localhost
  client:
    # Tell Eureka Server NOT to register with itself
    register-with-eureka: false
    # Tell Eureka Server NOT to fetch registry from another server (since this is a standalone registry)
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  # server:
  #   # Disable self-preservation in development so dropped instances are evicted quickly
  #   enable-self-preservation: false
  #   eviction-interval-timer-in-ms: 5000

# Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

